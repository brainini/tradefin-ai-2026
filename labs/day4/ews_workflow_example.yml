# ews_workflow_example.yml — 경보 워크플로 예시(4일차 실습 B ②). 내 저장소의 .github/workflows/d4-ews.yml 로 복사해 쓴다.
# Claude Code 로 scripts/ews.py 를 만들었다면 아래 run 의 두 줄을 scripts/ews.py · scripts/post_issue.py 로 바꾼다.
# 이 파일의 두 줄은 labs/day4 의 참고 스크립트(ews_example.py · post_issue_example.py)를 돌리는 판이다 — 채팅 경로 · 대체 경로용.
#
# 지키는 것
#  - 이 파일이 main 브랜치에 있어야 Actions 탭에 'Run workflow' 버튼이 생긴다(스케줄도 main 의 파일만 돈다).
#  - 러너는 빈 컴퓨터다 — 커밋된 파일만 보인다: 규칙(labs/day4/alert_rules.yml 또는 내 사본) · 엔진 · 이슈 스크립트 · 데이터 사본(workbench/day4/data/) 모두 main 에.
#  - data/checkpoints/ 의 원본은 .gitignore 때문에 커밋되지 않는다 — 입력은 workbench/day4/data/ 의 사본을 읽는다.
name: d4-ews
on:
  workflow_dispatch:           # 수동 실행 버튼 — 오늘은 이것만 쓴다
  # 예약은 '더 하기': 아래 두 줄의 # 를 지우면 평일 09:00 KST 에 돈다(cron 은 UTC: 한국 시각 − 9시간).
  # 켜 두면 평일 아침마다 돌고 실패하면 메일이 온다 — 연습이 끝나면 Actions 화면에서 Disable workflow 로 끈다.
  # schedule:
  #   - cron: "0 0 * * 1-5"
permissions: {contents: read, issues: write}     # 읽기 · 이슈 쓰기만 — 그 밖의 권한은 주지 않는다
jobs:
  ews:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: 경보 엔진 → 이슈
        run: |
          uv run python labs/day4/ews_example.py
          uv run python labs/day4/post_issue_example.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: alerts
          path: workbench/day4/outputs/
